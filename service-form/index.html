<body class="site-body">
<main class="form-page"><div class="container form-page-shell">
<header class="form-page-head">

</header>
<section class="form-card">
<form class="form-page-form" id="service-form" action="https://api.web3forms.com/submit" method="POST">
<input type="hidden" name="access_key" value="fae80777-5bb6-4044-beb2-d2f0d09874c3">
<input type="hidden" name="subject" value="طلب مشروع جديد — Ahmad Khalel">
<input type="hidden" name="from_name" value="Ahmad Khalel Service Form">
<input type="hidden" name="redirect" value="https://ahmadkhalel.com/form/">
<div class="form-page-field"><label for="name">الاسم</label><input id="name" name="name" type="text" autocomplete="name" placeholder="اسمك" required></div>

<div class="form-page-submit"><span class="form-page-note">سيتم استخدام رقم واتساب للتواصل معك بخصوص المشروع.</span><button type="submit">إرسال الطلب ↗</button></div>
