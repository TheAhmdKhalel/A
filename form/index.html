<script>document.getElementById('brand-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,m=document.getElementById('form-message');if(!f.checkValidity()){f.reportValidity();return;}try{const r=await fetch(f.action,{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}});const j=await r.json().catch(()=>({}));if(!r.ok||j.success!==true)throw 0;f.reset();m.hidden=false;m.textContent='تم إرسال المعلومات بنجاح.';}catch{m.hidden=false;m.textContent='تعذر إرسال النموذج حاليًا. حاول مرة أخرى.';}});</script>
