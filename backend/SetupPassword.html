<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmad Khalel — Admin Password Setup</title>
<style>
:root{font-family:Arial,sans-serif;color:#20201e;background:#f3f1ec}
*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:520px;margin:9vh auto}
.card{background:#fff;border:1px solid #ded9cf;border-radius:20px;padding:28px;box-shadow:0 12px 40px #00000008}
.brand{letter-spacing:.08em;font-size:12px;text-transform:uppercase;margin-bottom:20px}
h1{font-size:30px;margin:0 0 8px}p{color:#77736b;line-height:1.6}
label{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}
input{width:100%;padding:13px 14px;border:1px solid #d3cec4;border-radius:11px;font:inherit}
button{margin-top:20px;border:0;border-radius:11px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:#20201e;color:#fff}
.status{margin-top:14px;min-height:22px;font-size:14px}.ok{color:#276749}.err{color:#a33}
</style>
</head>
<body>
<div class="wrap"><section class="card">
<div class="brand">AHMAD KHALEL / ADMIN</div>
<h1>Create Admin Password</h1>
<p>Create the password that will protect your Admin dashboard. Use at least 10 characters.</p>
<form id="form">
<label>Password<input id="password" type="password" minlength="10" autocomplete="new-password" required></label>
<label>Confirm password<input id="confirm" type="password" minlength="10" autocomplete="new-password" required></label>
<button id="save" type="submit">Save Password</button>
<div id="status" class="status"></div>
</form>
</section></div>
<script>
const token = new URLSearchParams(location.search).get('token');
const status = document.getElementById('status');
document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const p=document.getElementById('password').value;
  const c=document.getElementById('confirm').value;
  if(p.length<10){status.textContent='Password must be at least 10 characters.';status.className='status err';return}
  if(p!==c){status.textContent='Passwords do not match.';status.className='status err';return}
  document.getElementById('save').disabled=true;
  status.textContent='Saving…'; status.className='status';
  google.script.run
    .withSuccessHandler(() => {
      status.textContent='Password created successfully. You can now open the Admin panel.';
      status.className='status ok';
      document.getElementById('form').reset();
      document.getElementById('save').disabled=true;
    })
    .withFailureHandler(err => {
      status.textContent=(err && err.message)||'Could not save password.';
      status.className='status err';
      document.getElementById('save').disabled=false;
    })
    .saveAdminPasswordFromSetup(p, token);
});
</script>
</body>
</html>
