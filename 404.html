<title>404 — الصفحة غير موجودة | أحمد خليل</title>
<link rel="icon" type="image/png" href="assets/images/ahmad-icon.png">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/background.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/sections.css"><link rel="stylesheet" href="css/responsive.css">
<style>
.error-page{min-height:100svh;display:grid;place-items:center;padding:40px 20px}.error-card{width:min(720px,100%);text-align:center;padding:clamp(36px,7vw,80px);border:1px solid var(--color-border,#ddd);border-radius:28px;background:rgba(255,255,255,.7);backdrop-filter:blur(12px)}.error-code{font-size:clamp(5rem,18vw,11rem);line-height:.8;font-family:var(--font-display);letter-spacing:-.08em;margin:0 0 28px;color:var(--color-accent-deep)}.error-card h1{font-family:var(--font-display);font-size:clamp(2rem,5vw,4rem);margin:0 0 14px}.error-card p{max-width:520px;margin:0 auto 28px;line-height:1.9;color:var(--color-text-muted)}.error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.error-actions a{display:inline-flex;padding:13px 20px;border-radius:12px;text-decoration:none}.error-primary{background:#20201e;color:#fff}.error-secondary{border:1px solid var(--color-border,#ddd);color:inherit}
</style>
</head>
<body class="site-body">
<main class="error-page"><section class="error-card">
<p class="error-code">404</p>
<h1>هذه الصفحة أخذت طريقًا آخر.</h1>
<p>يبدو أن الرابط الذي وصلت إليه غير موجود أو تغيّر. يمكنك العودة إلى الصفحة الرئيسية ومتابعة استكشاف أعمالي وخدماتي.</p>
<div class="error-actions"><a class="error-primary" href="./">العودة إلى الرئيسية ↗</a><a class="error-secondary" href="./#contact">لنتحدث عن مشروعك</a></div>
</section></main>
</body>
</html>
